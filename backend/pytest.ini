[pytest]
# Configuración de pytest para Tools4Milk MVP

# Directorio raíz para tests
testpaths = tests

# Patrones de nombres de archivos de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Mantener la salida enfocada; pytest mostrara stdout/stderr si un test falla.
addopts = -v --tb=short
cache_dir = .pytest_cache_runtime

# Configurar logs
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Markers personalizados
markers =
    auth: Tests relacionados con autenticación
    db: Tests que requieren base de datos
    integration: Tests de integración
    unit: Tests unitarios
    slow: Tests que toman tiempo
