name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: "ci-secret-key-not-for-production-aaaaaaaaaaaaaaa"
      INITIAL_DEMO_PASSWORD: "testpass123"
      ENVIRONMENT: "development"
      AEMET_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        # El test del seed lanza subprocesos con su propio DATABASE_URL;
        # está cubierto por el job migrations-pg más abajo.
        run: pytest tests/ -v --tb=short --ignore=tests/test_seed_realistic_data.py

  migrations-pg:
    name: Migrations vs Postgres 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tools4milk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tools4milk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/tools4milk_test"
      SECRET_KEY: "ci-secret-key-not-for-production-aaaaaaaaaaaaaaa"
      INITIAL_DEMO_PASSWORD: "testpass123"
      ENVIRONMENT: "development"
      AEMET_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations (idempotente)
        run: |
          python scripts/apply_migrations.py
          python scripts/apply_migrations.py

      - name: Verify schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d tools4milk_test \
              -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';" \
              | tee /tmp/tables.txt
          grep -qE '^[[:space:]]*[1-9][0-9]*[[:space:]]*$' /tmp/tables.txt

          PGPASSWORD=postgres psql -h localhost -U postgres -d tools4milk_test \
              -c "\dv" | grep -E "v_produccion_diaria|v_vacas_en_retirada|v_tratamientos_pendientes"

      - name: Run seed_realistic_data
        run: |
          python scripts/seed_realistic_data.py
          python scripts/seed_realistic_data.py

      - name: Verify seed counts
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d tools4milk_test -t -A -c "
              SELECT 'animales ' || count(*) FROM animales
              UNION ALL SELECT 'lactaciones ' || count(*) FROM lactaciones
              UNION ALL SELECT 'alertas ' || count(*) FROM alertas
              UNION ALL SELECT 'empleados ' || count(*) FROM empleados;
          " | tee /tmp/seed_counts.txt
          for tabla in animales lactaciones alertas empleados; do
              count=$(grep "^$tabla " /tmp/seed_counts.txt | awk '{print $2}')
              if [ -z "$count" ] || [ "$count" -lt 1 ]; then
                  echo "ERROR: $tabla debería tener >= 1 fila tras el seed, tiene '$count'"
                  exit 1
              fi
          done

  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
