name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: "ci-secret-key-not-for-production-aaaaaaaaaaaaaaa"
      INITIAL_DEMO_PASSWORD: "testpass123"
      ENVIRONMENT: "development"
      AEMET_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        # El test del seed lanza subprocesos con su propio DATABASE_URL;
        # está cubierto por el job migrations-pg más abajo.
        run: pytest tests/ -v --tb=short --ignore=tests/test_seed_realistic_data.py

  migrations-pg:
    name: Migrations vs Postgres 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tools4milk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tools4milk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/tools4milk_test"
      SECRET_KEY: "ci-secret-key-not-for-production-aaaaaaaaaaaaaaa"
      INITIAL_DEMO_PASSWORD: "testpass123"
      ENVIRONMENT: "development"
      AEMET_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations (idempotente)
        run: |
          python scripts/apply_migrations.py
          python scripts/apply_migrations.py

      - name: Verify schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d tools4milk_test \
              -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';" \
              | tee /tmp/tables.txt
          grep -qE '^[[:space:]]*[1-9][0-9]*[[:space:]]*$' /tmp/tables.txt

          PGPASSWORD=postgres psql -h localhost -U postgres -d tools4milk_test \
              -c "\dv" | grep -E "v_produccion_diaria|v_vacas_en_retirada|v_tratamientos_pendientes"

      - name: Run seed_realistic_data
        run: |
          python scripts/seed_realistic_data.py
          python scripts/seed_realistic_data.py

      - name: Verify seed counts
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d tools4milk_test -t -A -c "
              SELECT 'animales ' || count(*) FROM animales
              UNION ALL SELECT 'lactaciones ' || count(*) FROM lactaciones
              UNION ALL SELECT 'alertas ' || count(*) FROM alertas
              UNION ALL SELECT 'empleados ' || count(*) FROM empleados;
          " | tee /tmp/seed_counts.txt
          for tabla in animales lactaciones alertas empleados; do
              count=$(grep "^$tabla " /tmp/seed_counts.txt | awk '{print $2}')
              if [ -z "$count" ] || [ "$count" -lt 1 ]; then
                  echo "ERROR: $tabla debería tener >= 1 fila tras el seed, tiene '$count'"
                  exit 1
              fi
          done

  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (portable standalone)
        run: npm run build

      - name: Production dependency audit gate
        run: npm audit --omit=dev --audit-level=high --json > npm-audit-production.json

      - name: Full dependency audit report (development findings allowed)
        run: npm audit --json > npm-audit-full.json || test "$?" -eq 1

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-reports
          path: |
            frontend/npm-audit-production.json
            frontend/npm-audit-full.json
          if-no-files-found: error

  portable:
    name: Portable R3 (compose config + builds + CLI + OpenAPI + specs)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: "ci-secret-key-not-for-production-aaaaaaaaaaaaaaa"
      INITIAL_DEMO_PASSWORD: "testpass123"
      ENVIRONMENT: "development"
      AEMET_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose interpolation (demo project)
        run: docker compose -p tfm_r3_ci -f docker-compose.yml config --quiet

      - name: Build backend image (non-root runtime)
        run: docker build ./backend -t tfm-r3-backend-ci --label tfm_r3_ci=true

      - name: Build frontend image (Node 24 standalone)
        run: docker build ./frontend -t tfm-r3-frontend-ci --label tfm_r3_ci=true

      - name: Verify backend image runs as non-root
        run: |
          docker run --rm --entrypoint whoami tfm-r3-backend-ci | tee /tmp/whoami.txt
          grep -qx "appuser" /tmp/whoami.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: CLI unit tests (scripts/demo.py, stdlib only)
        run: python -m pytest tests/test_demo_cli.py -v --tb=short

      - name: OpenAPI deterministic snapshot + diff gate
        working-directory: backend
        run: |
          python - <<'EOF'
          import hashlib, json
          from fastapi.testclient import TestClient
          from app.main import app
          snaps = []
          for _ in range(2):
              with TestClient(app) as client:
                  snaps.append(client.get("/openapi.json").json())
          a = json.dumps(snaps[0], sort_keys=True, ensure_ascii=False)
          b = json.dumps(snaps[1], sort_keys=True, ensure_ascii=False)
          assert a == b, "openapi.json no es determinista entre dos generaciones"
          open("openapi.r3.json", "w", encoding="utf-8").write(a + "\n")
          print("openapi sha256:", hashlib.sha256(a.encode()).hexdigest())
          # Contrato R3: health/db protegido (401 sin auth en el schema de seguridad global no aplica;
          # el endpoint declara dependencia de admin — verificar presencia de la ruta).
          assert "/api/v1/health/db" in snaps[0]["paths"], "falta /api/v1/health/db en OpenAPI"
          EOF

      - name: Upload OpenAPI snapshot
        uses: actions/upload-artifact@v4
        with:
          name: openapi-r3
          path: backend/openapi.r3.json
          if-no-files-found: error

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Playwright specs (list only; full run is local gate)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright test --list
          npx playwright --version
    # NOTA: el gate E2E completo (stack `docker compose -p tfm_r3_demo up` +
    # `python scripts/demo.py smoke` + `npx playwright test` con axe) es
    # intencionadamente local — ver docs/RELEASE3.md "Gate E2E completo
    # (local)". CI valida que las specs compilan/listan sin fingir ejecución.
